[package]
name = "mqtt"
version = "0.1.0"
authors = ["Mike Morgan <morgan.mike55@gmail.com>"]
edition = "2021"
resolver = "2"

[workspace]
members = [
    ".",
    "common/lib/get-uuid",
    "common/lib/mqtt-messages",
    "common/lib/rgb-led",
    "common/lib/wifi",
]

[workspace.dependencies]
anyhow = "=1.0.95"
esp-idf-svc = "=0.50.1"
log = "=0.4.22"
embuild = "=0.33.0"
serde_json = "1.0.140"
toml-cfg = "=0.1.3"
rgb = "0.8.50"
embedded-svc = "=0.28.1"
futures = "0.3.31"

[[bin]]
name = "mqtt"
harness = false # We can't use the default rust libtest harness for a crosscompile target

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[dependencies]
anyhow = { workspace = true }
bme280 = "0.5.1"
embedded-svc = { workspace = true }
esp-idf-svc = { workspace = true }
get-uuid = { path = "common/lib/get-uuid" }
log = { workspace = true }
mqtt-messages = { path = "common/lib/mqtt-messages" }
shtcx = "=1.0.0"
toml-cfg = { workspace = true }
wifi = { path = "common/lib/wifi" }
serde_json = { workspace = true }
futures = { workspace = true }

[build-dependencies]
embuild = { workspace = true }
toml-cfg = { workspace = true }
